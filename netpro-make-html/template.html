<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Netpro Visual Architecture</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        dark: {
                            900: '#070b14',
                            800: '#0f172a',
                            700: '#1e293b',
                            600: '#334155',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #070b14;
            color: #f1f5f9;
            font-size: 17px;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes flowFast {
            0% { transform: translateX(0); opacity: 0.9; }
            100% { transform: translateX(100%); opacity: 0.2; }
        }
        @keyframes flowSmooth {
            0% { transform: translateX(0); opacity: 0.3; }
            50% { opacity: 1; }
            100% { transform: translateX(100%); opacity: 0.3; }
        }
        .stream-particle {
            position: absolute;
            height: 6px;
            width: 14px;
            border-radius: 9999px;
            animation: flowFast 0.6s linear infinite;
        }
        .smooth-particle {
            position: absolute;
            height: 10px;
            width: 24px;
            border-radius: 9999px;
            background: linear-gradient(90deg, #10b981, #06b6d4);
            box-shadow: 0 0 15px #06b6d4;
            animation: flowSmooth 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="selection:bg-cyan-500 selection:text-white">

    <header class="border-b border-slate-800 bg-dark-900/90 backdrop-blur sticky top-0 z-50 py-5 px-6 md:px-12">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 via-blue-500 to-emerald-400 flex items-center justify-center text-dark-900 font-black text-2xl shadow-xl shadow-cyan-500/25">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <span class="text-xs font-mono font-bold text-cyan-400 tracking-widest uppercase block">NETPRO SYSTEM ARCHITECTURE</span>
                    <h1 class="text-xl md:text-2xl font-black text-white">{{TITLE}}</h1>
                </div>
            </div>
            <span class="px-4 py-1.5 rounded-full text-sm font-bold bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span> Trực quan • Chữ To • 60 FPS
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 py-10 space-y-16">
        <!-- 1. CỐT LÕI BÀI TOÁN -->
        <section class="space-y-6">
            <!-- Nội dung phần 1 -->
        </section>

        <!-- 2. SƠ ĐỒ KHỐI KIẾN TRÚC -->
        <section class="space-y-6">
            <!-- Sơ đồ các tầng kiến trúc + animated stream track -->
        </section>

        <!-- 3. SO SÁNH ĐỐI CHIẾU -->
        <section class="space-y-6">
            <!-- So sánh các giải pháp -->
        </section>

        <!-- 4. THỰC NGHIỆM MÔ PHỎNG TƯƠNG TÁC -->
        <section class="space-y-6">
            <!-- JavaScript interactive demo -->
        </section>

        <!-- 5. TỔNG KẾT HÀNH ĐỘNG -->
        <section class="p-8 md:p-10 rounded-3xl bg-gradient-to-r from-dark-800 via-dark-800 to-cyan-950/40 border-2 border-cyan-500/40 space-y-4">
            <!-- 3 bước áp dụng -->
        </section>
    </main>

    <footer class="mt-20 border-t border-slate-800 py-8 text-center text-sm text-slate-500 font-mono">
        Netpro Architecture Visualization • Designed for high readability
    </footer>
</body>
</html>
